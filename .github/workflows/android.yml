name: Build Dojo Patras Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  workflow_dispatch:

permissions:
  contents: write # first run commits the generated gen/android project back

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform, build-tools, NDK)
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.1.12297006"

      - name: Export NDK_HOME
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      # `tauri android init` validates that ALL four Android targets are
      # installed, even though we only build aarch64
      - name: Set up Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      # ── One-time bootstrap: generate the Android project + icons and commit ──
      # Local dev machine cannot run `tauri android init` (no Java/SDK), so CI
      # owns this. Steps are separate so a failure is attributable by name.
      - name: Check for committed Android project
        id: gencheck
        run: echo "exists=$([ -f src-tauri/gen/android/app/build.gradle.kts ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Initialize Android project (first run only)
        if: steps.gencheck.outputs.exists == 'false'
        run: npm run tauri android init

      - name: Generate icons (first run only)
        if: steps.gencheck.outputs.exists == 'false'
        # repo logo.png is 171x155 and `tauri icon` requires a square source —
        # gen-icon renders a square 256x256 icon.png (and a square logo.png)
        run: |
          cargo run --manifest-path tools/gen-icon/Cargo.toml --release
          npm run tauri icon src-tauri/icons/icon.png

      - name: Commit generated Android project (first run only)
        if: steps.gencheck.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f src-tauri/gen/android
          git add -A
          git commit -m "chore(android): commit generated Android project and icons [skip ci]"
          git push

      - name: Configure release signing
        if: env.HAS_SIGNING == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > src-tauri/gen/android/keystore.jks
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          } > src-tauri/gen/android/keystore.properties

      - name: Build APK (aarch64, release-signed)
        if: env.HAS_SIGNING == 'true'
        run: npm run tauri android build -- --apk --target aarch64

      # Without signing secrets, fall back to a debug-signed prototype APK.
      # NOTE: each debug build has a fresh signature — updates then require
      # uninstall (which deletes the sandboxed database). Add the secrets
      # before handing the tablet over.
      - name: Build APK (aarch64, debug-signed fallback)
        if: env.HAS_SIGNING != 'true'
        run: npm run tauri android build -- --apk --target aarch64 --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dojo-patras-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error
